{% extends 'base.html' %}

{% block title %}Login · BlogHub{% endblock %}

{% block content %}

<main class="flex-1 flex items-center justify-center bg-slate-50 px-4 py-16">
    <div class="w-full max-w-md">

        <div class="text-center mb-6">
            <span class="text-4xl">✍️</span>
            <h1 class="text-2xl font-extrabold text-slate-900 mt-2">Welcome back</h1>
            <p class="text-slate-500 text-sm mt-1">Log in to continue to BlogHub</p>
        </div>

        <form action="" method="post" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 space-y-5">
            {% csrf_token %}

            <div>
                <label for="email" class="block text-sm font-semibold text-slate-700 mb-1.5">Email</label>
                <input id="email" type="text" value="" name="email"
                    class="w-full text-sm border border-slate-300 p-2.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-400 focus:border-transparent">
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
                <input id="password" type="password" value="" name="password"
                    class="w-full text-sm border border-slate-300 p-2.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-400 focus:border-transparent">
            </div>

            {% if request.GET.next %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">
            {% endif %}

            <button type="submit" class="w-full bg-rose-500 hover:bg-rose-400 text-white font-semibold py-3 rounded-lg transition">
                Login
            </button>

            <p class="text-center text-sm text-slate-500">
                Not registered? <a class="font-semibold text-rose-600 hover:text-rose-700" href="{% url 'register' %}">Create an account</a>
            </p>
        </form>
    </div>
</main>

{% endblock content %}
