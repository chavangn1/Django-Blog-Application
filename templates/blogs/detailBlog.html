<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% if blog %}
        {{ blog.tiltle }}
        {{ blog.author }}
        {{ blog.category }}
    {% else %}
    <p>No blog are found</p>
    {% endif %}

    <h2>Add comment</h2>
    <form action="" method="post">
        {% csrf_token %}
        {{form.as_p}}
        <input type="submit">
    </form>

    <h2>Recent Comments</h2>
    {% if comments %}

        {% for comment in comments%}
            <p>{{comment.comment}} by {{comment.author}}</p>
        {% endfor%}
        
    {% endif %}

</body>
</html>
